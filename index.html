<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CamStay — Trouvez les meilleurs hébergements au Cameroun</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'DM Sans', sans-serif;
  overflow: hidden;
}

/* ── BACKGROUND ── */
.splash {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.splash-bg {
  position: absolute;
  inset: 0;
  background-image: url('https://www.shutterstock.com/image-photo/centre-region-cameroon-june-15-600nw-2645575133.jpg');
  background-size: cover;
  background-position: center;
  z-index: 0;
}

/* Dark gradient overlay */
.splash-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    160deg,
    rgba(10, 20, 50, 0.72) 0%,
    rgba(15, 35, 80, 0.60) 50%,
    rgba(8, 16, 40, 0.75) 100%
  );
  z-index: 1;
}

/* ── LANG SWITCHER (top right) ── */
.lang-switcher {
  position: absolute;
  top: 1.75rem;
  right: 2rem;
  display: flex;
  align-items: center;
  gap: 0.25rem;
  z-index: 10;
}

.lang-btn {
  padding: 0.35rem 0.75rem;
  border-radius: 6px;
  border: 1.5px solid rgba(255,255,255,0.35);
  background: transparent;
  color: rgba(255,255,255,0.65);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: all 0.2s;
}
.lang-btn:hover {
  border-color: rgba(255,255,255,0.7);
  color: white;
}
.lang-btn.active {
  background: rgba(255,255,255,0.15);
  border-color: white;
  color: white;
}

.lang-sep {
  width: 1px;
  height: 16px;
  background: rgba(255,255,255,0.25);
}

/* ── CENTER CONTENT ── */
.splash-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 0 1.5rem;
  animation: fadeInUp 0.8s ease both;
}

/* Logo */
.splash-logo {
  font-family: 'Sora', sans-serif;
  font-size: clamp(3rem, 8vw, 5rem);
  font-weight: 800;
  line-height: 1;
  margin-bottom: 1.25rem;
  letter-spacing: -0.02em;
}
.logo-cam { color: #ffffff; }
.logo-stay { color: #1656f9; }

/* Tagline */
.splash-tagline {
  font-family: 'Sora', sans-serif;
  font-size: clamp(1rem, 2.5vw, 1.3rem);
  font-weight: 400;
  color: rgba(255,255,255,0.88);
  line-height: 1.55;
  max-width: 400px;
  margin-bottom: 2.75rem;
}
.splash-tagline strong {
  color: white;
  font-weight: 600;
}

/* Buttons */
.splash-actions {
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  width: 100%;
  max-width: 320px;
}

.btn-login {
  padding: 0.9rem 2rem;
  background: transparent;
  border: 2px solid rgba(255,255,255,0.75);
  border-radius: 12px;
  color: white;
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
  letter-spacing: 0.01em;
}
.btn-login:hover {
  background: rgba(255,255,255,0.12);
  border-color: white;
}

.btn-register {
  padding: 0.9rem 2rem;
  background: #1a56db;
  border: 2px solid #1a56db;
  border-radius: 12px;
  color: white;
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
  letter-spacing: 0.01em;
}
.btn-register:hover {
  background: #1341b0;
  border-color: #1341b0;
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(26,86,219,0.45);
}

.see-all {
  color: #fff;
  font-weight: 600;
  font-size: 0.9rem;
  transition: opacity 0.2s;
  text-decoration: none;
}
.see-all:hover { opacity: 0.7; }

/* ── BOTTOM BADGE ── */
.splash-footer {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  color: rgba(255,255,255,0.45);
  font-size: 0.78rem;
  white-space: nowrap;
}
.splash-footer span { color: rgba(255,255,255,0.6); font-weight: 500; }
.footer-dot {
  width: 3px; height: 3px;
  background: rgba(255,255,255,0.3);
  border-radius: 50%;
}

/* ── ANIMATION ── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}

.splash-logo   { animation: fadeInUp 0.7s 0.1s ease both; }
.splash-tagline { animation: fadeInUp 0.7s 0.25s ease both; }
.splash-actions { animation: fadeInUp 0.7s 0.4s ease both; }

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
  .lang-switcher { top: 1.25rem; right: 1.25rem; }
  .splash-actions { max-width: 100%; }
  .splash-footer,.splash-footer span{
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .footer-dot{display: none;}
}
</style>
</head>
<body>

<div class="splash">

  <!-- Background image -->
  <div class="splash-bg"></div>
  <div class="splash-overlay"></div>

  <!-- Language switcher -->
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('fr', this)">FR</button>
    <div class="lang-sep"></div>
    <button class="lang-btn" onclick="setLang('en', this)">EN</button>
  </div>

  <!-- Main content -->
  <div class="splash-content">
    <div class="splash-logo">
      <span class="logo-cam">Cam</span><span class="logo-stay">Stay</span>
    </div>

    <p class="splash-tagline" id="tagline">
      Trouvez, Comparez, Réservez.<br>
      <strong>Voyagez au Cameroun.</strong>
    </p>

    <div class="splash-actions">
      <button class="btn-login" onclick="window.location.href='login.html'" id="btn-login">
        Se connecter
      </button>
      <button class="btn-register" onclick="window.location.href='login.html'" id="btn-register">
        Créer un compte
      </button>
      <a href="accueil.html" class="see-all">Visiter le site →</a>
    </div>
  </div>

  <!-- Footer -->
  <div class="splash-footer">
    <span>© 2026 CamStay</span>
    <div class="footer-dot"></div>
    <span>Hôtels · Résidences · Auberges</span>
    <div class="footer-dot"></div>
    <span>🇨🇲 Cameroun</span>
  </div>

</div>

<script>
const translations = {
  fr: {
    tagline: 'Trouvez, Comparez, Réservez.<br><strong>Voyagez au Cameroun.</strong>',
    login:    'Se connecter',
    register: 'Créer un compte',
  },
  en: {
    tagline: 'Find, Compare, Book.<br><strong>Travel across Cameroon.</strong>',
    login:    'Log in',
    register: 'Create an account',
  }
};

function setLang(lang, btn) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const t = translations[lang];
  document.getElementById('tagline').innerHTML   = t.tagline;
  document.getElementById('btn-login').textContent  = t.login;
  document.getElementById('btn-register').textContent = t.register;
  document.documentElement.lang = lang;
}
</script>

</body>
</html>
